<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Pengajuan Kredit — PT JKL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #16233b;
        --navy-2: #1f324f;
        --amber: #c4791f;
        --amber-light: #f4e3cc;
        --bg: #f3f4f1;
        --surface: #ffffff;
        --border: #e1e3de;
        --text: #181a1c;
        --text-2: #5b6169;
        --text-3: #8b9096;
        --danger: #a5352e;
        --danger-bg: #f8e7e5;
        --success: #2e6b4f;
        --success-bg: #e4f0e9;
        --warn-bg: #fbf0de;
        --radius: 10px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      .app {
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        width: 240px;
        background: var(--navy);
        color: #fff;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
      }
      .brand {
        padding: 24px 20px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }
      .brand-mark {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--amber);
      }
      .brand-name {
        font-size: 17px;
        font-weight: 600;
        margin-top: 4px;
      }
      .brand-sub {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.55);
        margin-top: 2px;
      }
      nav {
        padding: 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 8px;
        color: rgba(255, 255, 255, 0.75);
        font-size: 14px;
        cursor: pointer;
        border: none;
        background: none;
        text-align: left;
        width: 100%;
        font-family: inherit;
      }
      .nav-item:hover {
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
      }
      .nav-item.active {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-weight: 500;
      }
      .nav-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.5;
        flex-shrink: 0;
      }
      .nav-item.active .nav-dot {
        opacity: 1;
        background: var(--amber);
      }

      .main {
        flex: 1;
        padding: 32px 40px;
        max-width: 1100px;
      }
      .page-head {
        margin-bottom: 24px;
      }
      .page-head h1 {
        font-size: 22px;
        font-weight: 600;
      }
      .page-head p {
        font-size: 14px;
        color: var(--text-2);
        margin-top: 4px;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 28px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px 18px;
      }
      .card .num {
        font-size: 26px;
        font-weight: 700;
        font-family: "IBM Plex Mono", monospace;
      }
      .card .label {
        font-size: 12px;
        color: var(--text-2);
        margin-top: 4px;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
      }
      .panel + .panel {
        margin-top: 16px;
      }
      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-2);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 14px;
      }

      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .grid3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 14px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
      }
      .field label {
        font-size: 13px;
        color: var(--text-2);
      }
      .field input,
      .field select {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 11px;
        font-size: 14px;
        font-family: inherit;
        color: var(--text);
        background: var(--surface);
      }
      .field input:focus,
      .field select:focus {
        outline: 2px solid var(--navy-2);
        outline-offset: 0;
        border-color: var(--navy-2);
      }
      .field .err {
        font-size: 12px;
        color: var(--danger);
        display: none;
      }
      .field.has-err input,
      .field.has-err select {
        border-color: var(--danger);
      }
      .field.has-err .err {
        display: block;
      }

      .btn {
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        border-radius: 8px;
        padding: 10px 18px;
        border: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn-primary {
        background: var(--navy);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--navy-2);
      }
      .btn-amber {
        background: var(--amber);
        color: #fff;
      }
      .btn-amber:hover {
        background: #ad6a1a;
      }
      .btn-ghost {
        background: transparent;
        color: var(--text-2);
        border: 1px solid var(--border);
      }
      .btn-ghost:hover {
        background: var(--bg);
      }
      .btn-sm {
        padding: 6px 12px;
        font-size: 13px;
      }
      .btn-danger-outline {
        background: transparent;
        color: var(--danger);
        border: 1px solid var(--danger);
      }
      .btn-danger-outline:hover {
        background: var(--danger-bg);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      th {
        text-align: left;
        font-size: 12px;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 0.03em;
        padding: 0 10px 10px;
        border-bottom: 1px solid var(--border);
        font-weight: 600;
      }
      td {
        padding: 12px 10px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      tr:last-child td {
        border-bottom: none;
      }
      .cust {
        font-weight: 500;
      }
      .sub {
        color: var(--text-3);
        font-size: 12px;
      }

      .badge {
        display: inline-block;
        font-size: 12px;
        font-weight: 500;
        padding: 3px 10px;
        border-radius: 100px;
      }
      .badge-wait {
        background: var(--warn-bg);
        color: #8a5a15;
      }
      .badge-approved {
        background: var(--success-bg);
        color: var(--success);
      }
      .badge-rejected {
        background: var(--danger-bg);
        color: var(--danger);
      }
      .badge-ttd {
        background: #e5e9f2;
        color: #2e4270;
      }
      .badge-done {
        background: #dff1ea;
        color: #1e5e45;
      }

      .actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .empty {
        text-align: center;
        padding: 40px 20px;
        color: var(--text-3);
        font-size: 14px;
      }

      .doc-preview {
        border: 1px dashed var(--border);
        border-radius: 8px;
        padding: 20px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 12.5px;
        line-height: 1.7;
        background: #fbfbfa;
        white-space: pre-wrap;
      }
      .modal-overlay {
        position: absolute;
        inset: 0;
        background: rgba(15, 20, 28, 0.5);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 60px 20px;
        z-index: 50;
      }
      .modal {
        background: var(--surface);
        border-radius: 12px;
        max-width: 560px;
        width: 100%;
        padding: 26px;
        max-height: 80vh;
        overflow: auto;
      }
      .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .modal-head h3 {
        font-size: 16px;
        font-weight: 600;
      }
      .modal-close {
        background: none;
        border: none;
        font-size: 20px;
        color: var(--text-3);
        cursor: pointer;
        line-height: 1;
      }
      .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: var(--navy);
        color: #fff;
        padding: 12px 18px;
        border-radius: 8px;
        font-size: 13.5px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
        opacity: 0;
        transform: translateY(8px);
        transition: all 0.25s;
        pointer-events: none;
        z-index: 100;
      }
      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      .flow-note {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        background: var(--warn-bg);
        border-radius: 8px;
        padding: 12px 14px;
        font-size: 13px;
        color: #7a5211;
        margin-bottom: 18px;
      }

      @media (max-width: 820px) {
        .app {
          flex-direction: column;
        }
        .sidebar {
          width: 100%;
        }
        nav {
          flex-direction: row;
          overflow-x: auto;
        }
        .main {
          padding: 20px;
        }
        .cards {
          grid-template-columns: repeat(2, 1fr);
        }
        .grid2,
        .grid3 {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      // ---------- state ----------
      let pengajuan = [];
      let seq = 1;
      let view = "form";
      let modalId = null;

      function seed() {
        pengajuan.push(
          makePengajuan({
            namaKonsumen: "Rudi Hartono",
            nik: "1871020304890002",
            dealer: "Auto Prima Motor",
            merk: "Honda",
            model: "PCX 160",
            warna: "Hitam",
            harga: 32000000,
            dp: 6000000,
            tenor: 24,
            marketing: "Dewi Anjani",
          }),
          "Disetujui",
          true,
          false,
        );
        pengajuan.push(
          makePengajuan({
            namaKonsumen: "Siti Marlina",
            nik: "1871020304900005",
            dealer: "Sentosa Jaya Motor",
            merk: "Yamaha",
            model: "NMAX",
            warna: "Putih",
            harga: 35500000,
            dp: 7000000,
            tenor: 30,
            marketing: "Dewi Anjani",
          }),
        );
        render();
      }

      function makePengajuan(d, status, dokGen, ttd) {
        const angsuran = Math.round(((d.harga - d.dp) * 1.11) / d.tenor);
        const item = {
          id: seq++,
          tanggal: new Date().toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" }),
          ...d,
          angsuran,
          status: status || "Menunggu Approval",
          catatan: "",
          dokumenGenerated: !!dokGen,
          ttdUploaded: !!ttd,
        };
        return item;
      }

      // ---------- helpers ----------
      function rupiah(n) {
        return "Rp " + Number(n).toLocaleString("id-ID");
      }
      function toast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(window._toastT);
        window._toastT = setTimeout(() => t.classList.remove("show"), 2400);
      }
      function badge(status) {
        const map = {
          "Menunggu Approval": "badge-wait",
          Ditolak: "badge-rejected",
          Disetujui: "badge-approved",
          "Menunggu TTD": "badge-ttd",
          "Menunggu Pencairan": "badge-ttd",
          Selesai: "badge-done",
        };
        return `<span class="badge ${map[status] || ""}">${status}</span>`;
      }

      // ---------- actions ----------
      function submitForm(e) {
        e.preventDefault();
        const f = e.target;
        const fields = ["namaKonsumen", "nik", "dealer", "merk", "model", "warna", "harga", "dp", "tenor", "marketing"];
        let valid = true;
        fields.forEach((name) => {
          const el = f.querySelector(`[name="${name}"]`);
          const wrap = el.closest(".field");
          const empty = !el.value || (el.type === "number" && Number(el.value) <= 0);
          wrap.classList.toggle("has-err", empty);
          if (empty) valid = false;
        });
        if (!valid) {
          toast("Lengkapi semua data yang wajib diisi");
          return;
        }

        const data = {};
        fields.forEach((name) => {
          const el = f.querySelector(`[name="${name}"]`);
          data[name] = el.type === "number" ? Number(el.value) : el.value;
        });
        pengajuan.unshift(makePengajuan(data));
        f.reset();
        toast("Pengajuan berhasil dikirim, menunggu approval");
        view = "list";
        render();
      }

      function approve(id) {
        const p = pengajuan.find((x) => x.id === id);
        p.status = "Disetujui";
        toast(`Pengajuan #${id} disetujui`);
        render();
      }
      function reject(id) {
        const p = pengajuan.find((x) => x.id === id);
        p.status = "Ditolak";
        toast(`Pengajuan #${id} ditolak`);
        render();
      }
      function generateDoc(id) {
        const p = pengajuan.find((x) => x.id === id);
        p.dokumenGenerated = true;
        p.status = "Menunggu TTD";
        toast("Dokumen kontrak & PO dibuat otomatis");
        render();
      }
      function uploadTtd(id) {
        const p = pengajuan.find((x) => x.id === id);
        p.ttdUploaded = true;
        p.status = "Menunggu Pencairan";
        toast("Dokumen bertanda tangan tersimpan");
        render();
      }
      function cairkanDana(id) {
        const p = pengajuan.find((x) => x.id === id);
        p.status = "Selesai";
        toast(`Dana untuk pengajuan #${id} dicairkan`);
        render();
      }
      function openDoc(id) {
        modalId = id;
        render();
      }
      function closeDoc() {
        modalId = null;
        render();
      }
      function setView(v) {
        view = v;
        render();
      }

      // ---------- views ----------
      function renderSidebar() {
        const items = [
          { k: "form", label: "Ajukan kredit" },
          { k: "list", label: "Daftar pengajuan" },
          { k: "dashboard", label: "Dashboard" },
        ];
        return `
  <div class="sidebar">
    <div class="brand">
      <div class="brand-mark">PT JKL</div>
      <div class="brand-name">Portal kredit kendaraan</div>
      <div class="brand-sub">Digitalisasi proses pengajuan</div>
    </div>
    <nav>
      ${items
        .map(
          (i) => `
        <button class="nav-item ${view === i.k ? "active" : ""}" onclick="setView('${i.k}')">
          <span class="nav-dot"></span>${i.label}
        </button>`,
        )
        .join("")}
    </nav>
  </div>`;
      }

      function renderForm() {
        return `
  <div class="page-head">
    <h1>Ajukan kredit kendaraan</h1>
    <p>Diisi oleh marketing bersama konsumen. Dokumen fisik tidak perlu difotokopi — cukup data ini yang tersimpan ke sistem.</p>
  </div>
  <div class="panel">
    <form onsubmit="submitForm(event)">
      <div class="section-title">Data konsumen</div>
      <div class="grid2">
        <div class="field"><label>Nama konsumen</label><input name="namaKonsumen" placeholder="cth. Rudi Hartono"><span class="err">Wajib diisi</span></div>
        <div class="field"><label>NIK</label><input name="nik" placeholder="16 digit NIK"><span class="err">Wajib diisi</span></div>
      </div>
      <div class="section-title" style="margin-top:8px;">Data kendaraan</div>
      <div class="grid3">
        <div class="field"><label>Dealer</label><input name="dealer" placeholder="cth. Auto Prima Motor"><span class="err">Wajib diisi</span></div>
        <div class="field"><label>Merk</label><input name="merk" placeholder="cth. Honda"><span class="err">Wajib diisi</span></div>
        <div class="field"><label>Model</label><input name="model" placeholder="cth. PCX 160"><span class="err">Wajib diisi</span></div>
      </div>
      <div class="grid3">
        <div class="field"><label>Warna</label><input name="warna" placeholder="cth. Hitam"><span class="err">Wajib diisi</span></div>
        <div class="field"><label>Harga kendaraan (Rp)</label><input name="harga" type="number" min="1" placeholder="32000000"><span class="err">Wajib diisi</span></div>
        <div class="field"><label>Down payment (Rp)</label><input name="dp" type="number" min="1" placeholder="6000000"><span class="err">Wajib diisi</span></div>
      </div>
      <div class="section-title" style="margin-top:8px;">Data pinjaman</div>
      <div class="grid2">
        <div class="field">
          <label>Lama kredit (bulan)</label>
          <select name="tenor">
            <option value="">Pilih tenor</option>
            <option value="12">12 bulan</option>
            <option value="24">24 bulan</option>
            <option value="30">30 bulan</option>
            <option value="36">36 bulan</option>
          </select>
          <span class="err">Wajib diisi</span>
        </div>
        <div class="field"><label>Nama marketing</label><input name="marketing" placeholder="cth. Dewi Anjani"><span class="err">Wajib diisi</span></div>
      </div>
      <button class="btn btn-primary" type="submit">Kirim pengajuan</button>
    </form>
  </div>`;
      }

      function renderRow(p) {
        let actions = "";
        if (p.status === "Menunggu Approval") {
          actions = `<button class="btn btn-primary btn-sm" onclick="approve(${p.id})">Setujui</button>
               <button class="btn btn-danger-outline btn-sm" onclick="reject(${p.id})">Tolak</button>`;
        } else if (p.status === "Disetujui") {
          actions = `<button class="btn btn-amber btn-sm" onclick="generateDoc(${p.id})">Generate dokumen</button>`;
        } else if (p.status === "Menunggu TTD") {
          actions = `<button class="btn btn-ghost btn-sm" onclick="openDoc(${p.id})">Lihat dokumen</button>
               <button class="btn btn-amber btn-sm" onclick="uploadTtd(${p.id})">Unggah dok. TTD</button>`;
        } else if (p.status === "Menunggu Pencairan") {
          actions = `<button class="btn btn-ghost btn-sm" onclick="openDoc(${p.id})">Lihat dokumen</button>
               <button class="btn btn-amber btn-sm" onclick="cairkanDana(${p.id})">Cairkan dana</button>`;
        } else if (p.status === "Selesai") {
          actions = `<button class="btn btn-ghost btn-sm" onclick="openDoc(${p.id})">Lihat dokumen</button>`;
        } else {
          actions = `<span class="sub">Tidak ada aksi</span>`;
        }
        return `
  <tr>
    <td><span class="sub">#${p.id}</span></td>
    <td><div class="cust">${p.namaKonsumen}</div><div class="sub">${p.marketing}</div></td>
    <td>${p.merk} ${p.model}<div class="sub">${p.dealer}</div></td>
    <td>${rupiah(p.harga)}<div class="sub">${p.tenor} bln · ${rupiah(p.angsuran)}/bln</div></td>
    <td>${badge(p.status)}</td>
    <td><div class="actions">${actions}</div></td>
  </tr>`;
      }

      function renderList() {
        const rows = pengajuan.map(renderRow).join("");
        return `
  <div class="page-head">
    <h1>Daftar pengajuan</h1>
    <p>Approval, generate dokumen, hingga pencairan dilakukan dari satu tempat — tidak ada dokumen fisik berpindah tangan.</p>
  </div>
  <div class="panel">
    ${
      pengajuan.length
        ? `
    <table>
      <thead><tr><th>No.</th><th>Konsumen</th><th>Kendaraan</th><th>Nilai kredit</th><th>Status</th><th>Aksi</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`
        : `<div class="empty">Belum ada pengajuan. Mulai dari menu "Ajukan kredit".</div>`
    }
  </div>`;
      }

      function renderDashboard() {
        const total = pengajuan.length;
        const wait = pengajuan.filter((p) => p.status === "Menunggu Approval").length;
        const proses = pengajuan.filter((p) =>
          ["Disetujui", "Menunggu TTD", "Menunggu Pencairan"].includes(p.status),
        ).length;
        const selesai = pengajuan.filter((p) => p.status === "Selesai").length;
        return `
  <div class="page-head">
    <h1>Dashboard</h1>
    <p>Ringkasan status pengajuan kredit secara real-time.</p>
  </div>
  <div class="cards">
    <div class="card"><div class="num">${total}</div><div class="label">Total pengajuan</div></div>
    <div class="card"><div class="num">${wait}</div><div class="label">Menunggu approval</div></div>
    <div class="card"><div class="num">${proses}</div><div class="label">Dalam proses dokumen</div></div>
    <div class="card"><div class="num">${selesai}</div><div class="label">Selesai dicairkan</div></div>
  </div>
  <div class="flow-note">
    Alur digital: Input data → Approval → Generate dokumen → Tanda tangan (fisik) → Upload TTD → Pencairan dana.
  </div>
  ${renderList()}`;
      }

      function renderModal() {
        if (modalId === null) return "";
        const p = pengajuan.find((x) => x.id === modalId);
        if (!p) return "";
        const doc = `DOKUMEN KONTRAK PEMBIAYAAN KENDARAAN
PT JKL — Perkreditan Kendaraan Bermotor
No. Kontrak: JKL/${p.id.toString().padStart(5, "0")}/${new Date().getFullYear()}

Konsumen     : ${p.namaKonsumen}
NIK          : ${p.nik}
